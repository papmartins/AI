version: '3.8'

services:
  app:
    build: .
    container_name: laravel_app_prod
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php-fpm", "-F"]
    networks:
      - laravel_net
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_net
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 500M

  db:
    image: mariadb:11
    container_name: laravel_db_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - laravel_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  ml-service:
    build: ./ml_service
    container_name: ml-service-prod
    ports:
      - "8001:8001"
    environment:
      - NLP_SERVICE_PORT=8001
      - LOG_LEVEL=INFO
      - CACHE_TTL=7200
      - CACHE_SIZE=5000
      - WORKERS=8
      - MAX_REQUEST_SIZE=20MB
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - laravel_net
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1G

volumes:
  dbdata:

networks:
  laravel_net:
    driver: bridge
    name: laravel_net