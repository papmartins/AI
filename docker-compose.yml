
services:
  app:
    build: .
    container_name: laravel_app
    # restart: unless-stopped
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: ["php-fpm", "-F"]
    networks:
      - laravel_net
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    # restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_net
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: laravel_db
    # restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - laravel_net

  node:
    image: node:18-alpine
    container_name: laravel_node
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - laravel_net

  ml-service:
    build: ./ml_service
    container_name: ml-service
    ports:
      - "8001:8001"
    environment:
      - NLP_SERVICE_PORT=8001
      - LOG_LEVEL=INFO
      - CACHE_TTL=3600
      - CACHE_SIZE=1000
      - WORKERS=4
    volumes:
      - ./ml_service/src:/app/src
      - ./ml_service/models:/app/models
    # restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - laravel_net
    depends_on:
      - app

volumes:
  dbdata:

networks:
  laravel_net:
    driver: bridge
